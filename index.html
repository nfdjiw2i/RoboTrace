<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoboTrace</title>
<meta name="description" content="Монохромный терминал разведки Roblox: профили, друзья, игры, серверы, субплейсы, модерация и связи с Discord.">
<meta name="google" content="notranslate">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RoboTrace">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M16 4v24M5.6 10l20.8 12M5.6 22l20.8-12' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--pn:#111;--ln:#2b2b2b;--tx:#e8e8e8;--mu:#777;--ac:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
a{color:inherit}
header{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.2em;text-decoration:none;display:flex;align-items:center;gap:8px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 12px;border:1px solid transparent;text-decoration:none;color:var(--mu);letter-spacing:.15em;font-size:11px}
nav a.on,nav a:hover{color:var(--ac);border-color:var(--ln)}
#cfg{margin-left:auto}
main{max-width:1240px;margin:0 auto;padding:24px}
.p{position:relative;border:1px solid var(--ln);background:var(--pn);margin-bottom:20px}
.p:before,.p:after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--ac)}
.p:before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.p:after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.p>h3{margin:0;padding:16px 20px 0;font-size:11px;letter-spacing:.3em;font-weight:500;color:var(--mu);text-transform:uppercase}
.p>small{display:block;padding:2px 20px 12px;color:var(--mu);border-bottom:1px solid var(--ln)}
.pb{padding:16px 20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.mod{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;align-items:start}
@media(max-width:860px){.g2,.mod{grid-template-columns:1fr}}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.bar label{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:11px}
input,select{flex:1;min-width:120px;background:#0a0a0a;border:1px solid var(--ln);color:var(--tx);padding:11px 13px;font:inherit;outline:0}
input[type=number]{max-width:90px;min-width:70px;flex:none}
input[type=checkbox]{flex:none;min-width:0}
input:focus,select:focus{border-color:#666}
button,.btn{background:none;border:1px solid var(--ln);color:var(--tx);padding:9px 14px;font:inherit;font-size:11px;letter-spacing:.15em;cursor:pointer;text-transform:uppercase;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--ac)}
button:disabled{opacity:.4}
.sm{padding:4px 8px;font-size:10px;letter-spacing:.1em}
.r{display:flex;justify-content:space-between;gap:16px;padding:6px 0;color:var(--mu)}
.r b{color:var(--tx);font-weight:500;text-align:right;word-break:break-all}
.msg{color:var(--mu);padding:8px 0}.err{color:#ff6b6b}.ok{color:#7dff9b}
.lbl{font-size:11px;letter-spacing:.3em;color:var(--mu);margin:0 0 8px}
.big{font-size:34px;font-weight:700}
.rate{height:6px;background:#222;margin:14px 0 6px}.rate i{display:block;height:100%;background:#fff}
.desc{white-space:pre-wrap;color:#cfcfcf;max-height:260px;overflow:auto}
.av{display:flex;gap:20px;flex-wrap:wrap}.av img{width:200px;height:200px;background:#1a1a1a;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{border:1px solid var(--ln);padding:8px;text-align:center;overflow:hidden}
.card:hover{border-color:var(--ac)}.card img{width:100%;aspect-ratio:1;background:#1a1a1a;cursor:pointer}
.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.card button{margin-top:6px;width:100%}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:.25em;color:var(--mu);text-align:left;font-weight:500;padding:10px 14px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #1a1a1a;vertical-align:middle}
.tag{border:1px solid var(--ln);padding:2px 8px;font-size:11px;margin:2px;display:inline-block;cursor:pointer}
canvas{width:100%;height:460px;background:#0a0a0a;display:block}
.hit td{background:#222}
.sp{background:#0a0a0a;border:1px solid var(--ln);height:150px;position:relative;margin:12px 0}.sp svg{width:100%;height:100%;display:block}
.spl{position:absolute;right:6px;font-size:10px;color:var(--mu);font-style:normal}.spl.t{top:3px}.spl.b{bottom:3px}
button.on{background:#fff;color:#000;border-color:#fff}
.p>small:not(#scnt):not(.keep),.msg[style*="font-size:11px"]:not(.err):not(#sprog),#chg{display:none}
.p>small.keep{color:var(--tx)}
.cc{white-space:nowrap}.cc.na{color:var(--mu)}
#scnt{color:var(--tx);font-size:12px}.p>h3{color:#fff;font-size:12px}.p>h3+.pb{padding-top:12px}
.clk{cursor:pointer}.clk:hover td{background:#181818}
.avs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px;max-width:360px}
.avs img,.avs i{width:30px;height:30px;background:#1a1a1a;display:block}
.avs img.me{outline:2px solid #fff}
.jid{font-size:11px;word-break:break-all;color:#cfcfcf}
.ico{width:44px;height:44px;background:#1a1a1a;display:block}
.verdict{font-size:20px;font-weight:700;letter-spacing:.1em;padding:14px;border:1px solid var(--ln);text-align:center;margin-bottom:14px}
.verdict.bad{border-color:#ff6b6b;color:#ff6b6b}.verdict.good{border-color:#7dff9b;color:#7dff9b}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;display:none;z-index:9;font-size:12px}
h2.t{letter-spacing:.1em;margin:0 0 14px;font-size:20px}
.sk{background:linear-gradient(90deg,#161616,#262626,#161616);background-size:200% 100%;animation:skl 1.2s linear infinite;color:transparent!important;border-color:transparent!important}
@keyframes skl{to{background-position:-200% 0}}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-4px 0 14px}.chips:empty{display:none}
.chips .tag{margin:0}
body{background:var(--bg)}
header{background:rgba(11,11,11,.82);backdrop-filter:blur(10px)}
.logo{transition:.2s}.logo:hover{letter-spacing:.3em}
nav a{transition:.15s}nav a.on{background:#fff;color:#000;border-color:#fff}nav a:hover:not(.on){background:#181818}
.p{animation:fi .35s ease both;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:border-color .2s}.p:hover{border-color:#3d3d3d}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
button,.btn,.tag{transition:background .15s,color .15s,border-color .15s}
button:hover:not(:disabled):not(.on),.btn:hover,a.tag:hover{background:#fff;color:#000;border-color:#fff}
button:disabled{cursor:default}
input:focus,select:focus,textarea:focus{border-color:#888;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.card{transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-3px)}
.card img{border-bottom:1px solid var(--ln)}
tbody tr{transition:background .12s}tbody tr:hover td{background:#171717}
.av img,#pimg{border:1px solid var(--ln)}
.r{border-bottom:1px dashed #1d1d1d}.r:last-child{border-bottom:0}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#0b0b0b}::-webkit-scrollbar-thumb{background:#2c2c2c}::-webkit-scrollbar-thumb:hover{background:#444}
#toast{box-shadow:0 6px 24px rgba(0,0,0,.5);letter-spacing:.05em}
textarea{outline:0}
::selection{background:#fff;color:#000}

html{background:#070707}
body{background:transparent!important}
#bgfx{position:fixed;inset:0;width:100%;height:100%!important;z-index:-2;background:none;pointer-events:none}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 78%);mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 78%);animation:gd 40s linear infinite}
body:after{content:"";position:fixed;left:50%;top:-260px;width:1100px;height:620px;max-width:140vw;transform:translateX(-50%);z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(255,255,255,.13),rgba(255,255,255,.05) 55%,transparent);filter:blur(30px);animation:glow 9s ease-in-out infinite alternate}
@keyframes gd{to{background-position:56px 56px,56px 56px}}@keyframes glow{from{opacity:.75}to{opacity:1}}
.p{background:rgba(16,16,16,.78);backdrop-filter:blur(6px)}
header{background:rgba(8,8,8,.8)}
.logo{background:linear-gradient(90deg,#fff,#888 60%,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 6s linear infinite}
.logo svg{-webkit-text-fill-color:initial}@keyframes sh{to{background-position:-200%}}
.pc{cursor:pointer;text-align:left;padding:10px;display:flex;flex-direction:column;gap:4px}.pc img,.pc .sk{width:100%;aspect-ratio:1}
.pc b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc .ps{font-size:11px;color:var(--mu);line-height:1.6}.pc .ps i{font-style:normal;color:var(--tx)}
.grid.pin{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.rx{font-size:40px;font-weight:700}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/profile"><svg width="20" height="20" viewBox="0 0 32 32"><path d="M16 4v24M5.6 10l20.8 12M5.6 22l20.8-12" stroke="#fff" stroke-width="3"/></svg>RoboTrace</a>
  <nav id="nav"></nav><button id="cfg" class="sm" onclick="openCfg()">WORKER</button>
</header>
<canvas id="bgfx"></canvas><main id="app"></main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},
  s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const fmt = n => n==null ? '—' : Number(n).toLocaleString('ru-RU');
const dt = s => s ? new Date(s).toLocaleDateString('ru-RU') : '—';
const KEEP = /^(найдено|всего|.*\d+ друзей)/;
const panel = (t,sub,body) => `<section class="p"><h3>${t}</h3>${sub&&KEEP.test(sub)?`<small class="keep">${sub}</small>`:''}<div class="pb">${body}</div></section>`;
const row = (k,v) => `<div class="r"><span>${k}</span><b>${v}</b></div>`;
const val = (r,f,d='—') => r.status==='fulfilled' ? f(r.value) : d;
const post = body => ({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const sleep = ms => new Promise(r => setTimeout(r, ms));


const DB = 'https://robotrace-d4230-default-rtdb.firebaseio.com';
async function dbReq(path, method, body, q=''){
  const ac = new AbortController(), tm = setTimeout(()=>ac.abort(), 6000);
  try{
    const r = await fetch(`${DB}/${path}.json${q}`, {method, signal:ac.signal, body: body===undefined ? undefined : JSON.stringify(body)});
    if (!r.ok) throw new Error('DB HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}
const dbGet = (p,q) => dbReq(p,'GET',undefined,q);
const dbPush = (p,v) => dbReq(p,'POST',v).catch(()=>null);
const errBox = (el,m) => { el.innerHTML = `<div class="msg err">Ошибка: ${esc(m)}</div><button onclick="route()">Повторить</button>`; };
async function retry(fn, n){ for (let i=0;;i++){ try{ return await fn(); }catch(e){ if (i>=n-1) throw e; await sleep(1200*(i+1)); } } }
const joinUrl = (place, job) => `roblox://experiences/start?placeId=${place}${job?'&gameInstanceId='+job:''}`;
function toast(t){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',1500); }
function cp(t){
  const done=()=>toast('Скопировано');
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done,()=>fb()); else fb();
  function fb(){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch{} a.remove(); done(); }
}


const CAND = [
  (s,p) => `https://${s}.roproxy.com${p}`,
  (s,p) => `https://${s}.rotunnel.com${p}`,
  (s,p) => `https://corsproxy.io/?url=${encodeURIComponent(`https://${s}.roblox.com${p}`)}`,
  (s,p) => `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://${s}.roblox.com${p}`)}`
];
let okIdx = 0;
const QMAX = 4; let qRun = 0; const qWait = [];
const qAcq = () => new Promise(res => { const go = () => { if (qRun < QMAX){ qRun++; res(); } else qWait.push(go); }; go(); });
const qRel = () => { qRun--; const n = qWait.shift(); if (n) n(); };
const GCACHE = new Map();
async function api(sub, path, o){
  const isGet = !(o && o.method && o.method!=='GET'), key = sub+path;
  if (isGet){ const c = GCACHE.get(key); if (c && Date.now()-c.t < 60000) return c.v; }
  await qAcq();
  try{
    let v;
    try{ v = await api1(sub, path, o); }catch(e){ await sleep(1500); v = await api1(sub, path, o); }
    if (isGet) GCACHE.set(key, {t:Date.now(), v});
    return v;
  } finally { qRel(); }
}
async function api1(sub, path, o){
  const full = `https://${sub}.roblox.com${path}`, c = [];
  if (workerOn()) c.push(() => workerUrl(full));
  CAND.forEach((f,ix) => { if (!(o && o.method==='POST' && ix===3)) c.push(() => f(sub,path)); });
  let err;
  for (let k=0;k<c.length;k++){
    const i = (okIdx+k)%c.length;
    try{
      const r = await fetch(c[i](), {...o, headers:{'Accept-Language':'en-US,en;q=0.9', ...(o&&o.headers)}});
      if (r.ok){ okIdx = i; return await r.json(); }
      if (r.status===429) await sleep(1500);
      err = new Error('HTTP '+r.status);
    }catch(e){ err = e; }
  }
  throw new Error('Roblox сейчас не отвечает. Попробуйте ещё раз чуть позже.');
}
const WORKER = 'https://curly-heart-cb26.lvlyvcbcla.workers.dev/';
function workerOn(){ return true; }
function workerUrl(full){
  const base = ls.g('custom', WORKER) || WORKER;
  if (base.includes('{url}')) return base.replace('{url}', encodeURIComponent(full));
  try{ const u = new URL(base); u.searchParams.set('url', full); const key = ls.g('workerKey',''); if (key) u.searchParams.set('key', key); return u.toString(); }catch{ return full; }
}
function closeCfg(){ const m=$('#mdl'); if (m) m.remove(); }
function openCfg(){
  closeCfg();
  const d = document.createElement('div'); d.id = 'mdl';
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px';
  d.innerHTML = `<div class="p" style="max-width:560px;width:100%;margin:0"><h3>ВОРКЕР (CORS-ПРОКСИ)</h3><small>Настройки подключения Cloudflare Worker</small>
    <div class="pb"><input id="wk" placeholder="https://имя.аккаунт.workers.dev" style="width:100%;margin-bottom:10px" value="${esc(ls.g('custom',''))}"><input id="wkey" type="password" placeholder="KEY — если задан в Worker" style="width:100%;margin-bottom:12px" value="${esc(ls.g('workerKey',''))}">
    <div class="bar"><button onclick="saveCfg()">Сохранить</button><button onclick="testCfg()">Проверить</button><button onclick="closeCfg()">Закрыть</button></div><div id="wkr" class="msg"></div></div></div>`;
  document.body.appendChild(d);
}
function saveCfg(){ ls.s('custom', $('#wk').value.trim()); ls.s('workerKey', $('#wkey').value.trim()); closeCfg(); toast('Сохранено'); route(); }
async function testCfg(){
  const o = $('#wkr'); ls.s('custom', $('#wk').value.trim()); ls.s('workerKey', $('#wkey').value.trim()); o.textContent = 'проверяю…';
  try{
    const r = await fetch(workerUrl('https://users.roblox.com/v1/users/1'));
    const j = await r.json();
    o.innerHTML = j.name ? `<span class="ok">Работает: получен игрок ${esc(j.name)}</span>` : `<span class="err">Ответ без данных: ${esc(JSON.stringify(j).slice(0,120))}</span>`;
  }catch(e){ o.innerHTML = `<span class="err">Не работает: ${esc(e.message)}</span>`; }
}

async function resolveUser(q){
  q = String(q||'').trim();
  if (!q) throw new Error('Введите ник или ID');
  if (/^\d+$/.test(q)) return api('users','/v1/users/'+q);
  const r = await api('users','/v1/usernames/users', post({usernames:[q],excludeBannedUsers:false}));
  if (!r.data[0]) throw new Error('Игрок не найден');
  return api('users','/v1/users/'+r.data[0].id);
}
async function heads(ids){
  const m = {};
  for (let i=0;i<ids.length;i+=100){
    try{
      const r = await api('thumbnails',`/v1/users/avatar-headshot?userIds=${ids.slice(i,i+100).join()}&size=150x150&format=Png`);
      (r.data||[]).forEach(d => m[d.targetId] = d.imageUrl);
    }catch{}
  }
  return m;
}
async function headOf(id){
  for (let i=0;i<5;i++){
    const d = (await api('thumbnails',`/v1/users/avatar-headshot?userIds=${id}&size=150x150&format=Png&isCircular=false`)).data[0];
    if (d && d.imageUrl) return d.imageUrl;
    if (d && d.state==='Blocked') break;
    await sleep(800);
  }
  throw new Error('Roblox не отдал аватарку игрока (Pending/Blocked)');
}
const placeToUniverse = async id => (await api('apis',`/universes/v1/places/${id}/universe`)).universeId;


const imgKey = u => { try{ const x = new URL(u); if (x.hostname.toLowerCase().endsWith('rbxcdn.com')) return x.pathname.split('/').filter(Boolean)[0]?.toLowerCase() || ''; }catch{} return String(u||'').split('?')[0].toLowerCase(); };
window.AVSTAT = {ok:0, empty:0, fail:0, last:'', state:''};
let TOKTYPE = 'AvatarHeadShot';
const tokReq = t => ({requestId:`0:${t}:AvatarHeadshot:150x150:png:regular`,type:TOKTYPE,targetId:0,token:t,format:'png',size:'150x150',isCircular:false});
const tokOf = (d, c, i) => { const p = String(d.requestId||'').split(':')[1]; return c.includes(p) ? p : c[i]; };
async function tokBatch(c, cache, pend, flipped){
  const r = await api('thumbnails','/v1/batch', post(c.map(tokReq)));
  const data = r.data||[];
  if (data[0]) AVSTAT.raw = JSON.stringify(data[0]).slice(0,220);
  if (!flipped && data.length && data.every(d => !d.imageUrl && d.state==='Error')){
    TOKTYPE = TOKTYPE==='AvatarHeadShot' ? 'AvatarHeadshot' : 'AvatarHeadShot';
    return tokBatch(c, cache, pend, true);
  }
  const returned = new Set();
  data.forEach((d,i) => {
    const t = tokOf(d, c, i);
    if (!t) return;
    returned.add(t);
    if (d.imageUrl){ cache[t] = d.imageUrl; AVSTAT.ok++; }
    else { pend.push(t); AVSTAT.empty++; AVSTAT.state = d.state||''; }
  });
  c.forEach(t => { if (!returned.has(t) && !cache[t]) pend.push(t); });
}
async function tokAv(tokens, cache){
  const need = [...new Set(tokens)].filter(t => !cache[t]), ch = [], pend = [];
  for (let i=0;i<need.length;i+=100) ch.push(need.slice(i,i+100));
  for (let i=0;i<ch.length;i+=2){
    await Promise.all(ch.slice(i,i+2).map(c => tokBatch(c, cache, pend).catch(e => { AVSTAT.fail++; AVSTAT.last = e.message; })));
  }
  for (let r=0; r<3 && pend.length; r++){
    await sleep(1200*(r+1)); const cur = pend.splice(0);
    for (let i=0;i<cur.length;i+=100) await tokBatch(cur.slice(i,i+100), cache, pend).catch(()=>{});
  }
}


const sess = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random());
async function exploreSort(sortId, pages){
  const sid = sess(), out = []; let tok = '';
  for (let i=0;i<pages;i++){
    const r = await api('apis',`/explore-api/v1/get-sort-content?sessionId=${sid}&sortId=${encodeURIComponent(sortId)}&device=computer&country=all&cpuCores=8&maxResolution=1920x1080&maxMemory=8192&networkType=4g${tok?'&pageToken='+encodeURIComponent(tok):''}`);
    (r.games||[]).forEach(g => out.push(normGame(g)));
    tok = r.nextPageToken; if (!tok) break;
  }

}
const TZNAMES = {'-8':'США, Канада (Тихоокеанское)','-7':'США, Канада (Горное)','-6':'США, Мексика, Центральная Америка','-5':'США, Канада (Восток), Колумбия, Перу','-4':'Венесуэла, Чили, Боливия','-3':'Бразилия, Аргентина, Уругвай','-2':'Атлантика','-1':'Азорские о-ва, Кабо-Верде','0':'Великобритания, Португалия, Ирландия','1':'Германия, Франция, Польша, Испания, Италия','2':'Украина, Финляндия, Румыния, Израиль, Египет, ЮАР','3':'Россия (Москва), Беларусь, Турция, Саудовская Аравия','4':'ОАЭ, Азербайджан, Армения, Грузия','5':'Узбекистан, Пакистан, Казахстан (запад)','6':'Казахстан, Киргизия, Бангладеш','7':'Таиланд, Вьетнам, Индонезия','8':'Китай, Филиппины, Малайзия, Сингапур','9':'Япония, Южная Корея','10':'Австралия (восток)','11':'Соломоновы о-ва','12':'Новая Зеландия'};
async function countryFromActivity(id){
  const cur = Math.floor(Date.now()/SLOT);
  const r = await dbGet('activity/'+id, `?orderBy="$key"&startAt="${cur-WEEK}"`);
  const keys = Object.keys(r||{}).map(Number).filter(k => k>cur-WEEK && k<=cur);
  const days = new Set(keys.map(k => Math.floor(k*SLOT/864e5)));
  if (keys.length < 20 || days.size < 3) return 'Информация не обновлена';
  const H = new Array(48).fill(0);
  keys.forEach(k => { H[k % 48]++; });
  const n = 16; let best = 0, bi = 0;
  for (let i=0;i<48;i++){ let t = 0; for (let j=0;j<n;j++) t += H[(i+j)%48]; if (i===0 || t < best){ best = t; bi = i; } }
  const avg = H.reduce((a,b)=>a+b,0) * n / 48;
  if (best > avg*0.45) return 'Информация не обновлена';
  const centerUtc = ((bi + n/2) % 48) / 2;
  let off = Math.round(4.5 - centerUtc); while (off > 12) off -= 24; while (off < -11) off += 24;
  const nm = TZNAMES[String(off)];
  if (!nm) return 'Информация не обновлена';
  return `≈ UTC${off>=0?'+':''}${off} · ${esc(nm)} <span class="msg">по времени онлайна за неделю</span>`;
}

async function scanGame(place, target, pages, sg){
  let cursor = '';
  for (let p=0;p<pages;p++){
    if (sg.aborted) return null;
    const r = await api('games',`/v1/games/${place}/servers/Public?limit=100${cursor?'&cursor='+encodeURIComponent(cursor):''}`);
    const byTok = {}; r.data.forEach(s => (s.playerTokens||[]).forEach(t => byTok[t] = s));
    const toks = Object.keys(byTok);
    for (let i=0;i<toks.length;i+=100){
      if (sg.aborted) return null;
      const c = toks.slice(i,i+100);
      const rr = await api('thumbnails','/v1/batch', post(c.map(tokReq))).catch(()=>({data:[]}));
      const h = (rr.data||[]).find(d => d.imageUrl && imgKey(d.imageUrl) === imgKey(target));
      if (h) return byTok[tokOf(h, c, rr.data.indexOf(h))];
    }
    cursor = r.nextPageCursor; if (!cursor) break;
  }
  return null;
}
async function startScan(uid){

    const [mine,fav,top] = await Promise.allSettled([

    const list = [...cand], total = list.length; let done = 0, found = null;

async function friendsOf(id){
  let list = [], err = '', ok = false;
  for (let i=0;i<4 && !ok;i++){
    try{ const r = await api('friends',`/v1/users/${id}/friends`); if (r && Array.isArray(r.data)){ list = r.data; ok = true; } }catch(e){ err = e.message; }
    if (!ok) await sleep(1200*(i+1));
  }
  if (!list.length){
    try{
      let cur = '';
      for (let i=0;i<10;i++){
        const r = await api('friends',`/v1/users/${id}/friends/find?limit=50${cur?'&cursor='+encodeURIComponent(cur):''}`);
        ok = true; list.push(...(r.PageItems||r.data||[])); cur = r.NextCursor||r.nextPageCursor; if (!cur) break;
      }
    }catch(e){ err = e.message; }
  }
  if (!list.length){
    try{
      const r = await api('friends',`/v1/users/${id}/friends?userSort=StatusFrequents`);
      if (r && Array.isArray(r.data) && r.data.length){ list = r.data; ok = true; }
    }catch(e){ err = e.message; }
  }
  if (!list.length){
    if (!ok) throw new Error('Не удалось загрузить список друзей. Попробуйте ещё раз.');
    let c = 0; try{ c = (await api('friends',`/v1/users/${id}/friends/count`)).count; }catch{}
    if (c > 0) throw new Error(`У игрока ${c} друзей, но Roblox сейчас не отдаёт список. Попробуйте ещё раз.`);
  }
  const seen = new Set(); list = list.filter(f => f && f.id && !seen.has(f.id) && seen.add(f.id));
  const need = list.filter(f => !f.name).map(f => f.id);
  for (let i=0;i<need.length;i+=100){
    try{ const r = await api('users','/v1/users', post({userIds:need.slice(i,i+100),excludeBannedUsers:false})); const m = {}; (r.data||[]).forEach(x => m[x.id] = x); list = list.map(f => f.name ? f : (m[f.id]||f)); }catch{}
  }
  return list.map(f => ({id:f.id, name:f.name||String(f.id), displayName:f.displayName||f.name||String(f.id)}));
}

function graph(u, fr){
  const c = $('#cv'), d = devicePixelRatio||1, W = c.clientWidth, H = c.clientHeight;
  c.width = W*d; c.height = H*d;
  const x = c.getContext('2d'); x.scale(d,d);
  const cx = W/2, cy = H/2, R = Math.min(W,H)/2-50;
  const nodes = fr.map((f,i)=>({f, x:cx+R*Math.cos(i/fr.length*6.283), y:cy+R*Math.sin(i/fr.length*6.283)}));
  x.strokeStyle='#333'; nodes.forEach(n=>{x.beginPath();x.moveTo(cx,cy);x.lineTo(n.x,n.y);x.stroke()});
  x.fillStyle='#fff'; x.beginPath(); x.arc(cx,cy,10,0,7); x.fill();

function spark(h){
  if (h.length<2) return '';
  const mx = Math.max(...h.map(x=>x.p),1), mn = Math.min(...h.map(x=>x.p)), rg = (mx-mn)||1;
  const ln = h.map((x,i)=>(i/(h.length-1)*300).toFixed(1)+','+(8+(1-(x.p-mn)/rg)*44).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 300 60" preserveAspectRatio="none"><defs><linearGradient id="sgf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`+
    [15,30,45].map(y=>`<line x1="0" x2="300" y1="${y}" y2="${y}" stroke="#222" vector-effect="non-scaling-stroke"/>`).join('')+
    `<polygon points="0,60 ${ln} 300,60" fill="url(#sgf)"/><polyline points="${ln}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function statsHtml(h){
  const v = h.map(x=>x.p);
  return row('замеров',h.length)+row('минимум',fmt(Math.min(...v)))+row('максимум',fmt(Math.max(...v)))+
    row('среднее',fmt(Math.round(v.reduce((a,b)=>a+b,0)/v.length)))+row('первый замер',new Date(h[0].t).toLocaleString('ru-RU'));
}

async function srvCC(id, quiet){
  const S = window.SRV; if (S.cc[id]) return S.cc[id];
  if (!workerOn()){ if (!quiet) toast('Страна сервера недоступна'); throw new Error('worker'); }
  const body = {placeId:+S.place, isTeleport:false, gameId:id, gameJoinAttemptId:sess()};
  const go = tok => fetch(workerUrl('https://gamejoin.roblox.com/v1/join-game-instance'), {method:'POST', headers:{'Content-Type':'application/json', ...(tok?{'X-CSRF-TOKEN':tok}:{})}, body:JSON.stringify(body)});
  let r = await go('');
  if (r.status===403){ const t = r.headers.get('x-csrf-token'); if (t) r = await go(t); }
  const j = await r.json().catch(()=>({}));
  const ep = j.joinScript && j.joinScript.UdmuxEndpoints && j.joinScript.UdmuxEndpoints[0];
  const ip = ep && ep.Address;
  if (!ip){ if (!quiet) toast('Roblox не отдал адрес сервера'); throw new Error('noip'); }
  const g = await (await fetch('https://ipwho.is/'+encodeURIComponent(ip))).json();
  if (!g.success) throw new Error('geo');
  S.cc[id] = {c:g.country_code, n:g.country}; ls.s('srvcc', S.cc);
  if (!quiet){ fillCC(); renderServers(); }
  return S.cc[id];
}

async function detectCountries(){

  fillCC(); renderServers(true);

async function fpDoc(url){

  const r = await fetch(workerUrl('https://apis.roblox.com'+path), {headers:{'x-api-key':k}});
  const j = await r.json().catch(()=>({}));
  if (!r.ok){ const e = new Error(j.message || j.error || 'HTTP '+r.status); e.status = r.status; throw e; }
  return j;
}
async function ocCheck(all){
  const o = $('#ocr'); o.innerHTML = '<div class="msg">запрос…</div>';
  try{
    const uni = await placeToUniverse($('#mg').value.trim());
    if (!all){
      let g = {};
      try{ g = (await ocReq(`/cloud/v2/universes/${uni}/user-restrictions/${CUR.id}`)).gameJoinRestriction || {}; }catch(e){ if (e.status!==404) throw e; }
      o.innerHTML = `<div class="verdict ${g.active?'bad':'good'}">${g.active?'ЗАБАНЕН В ИГРЕ':'НЕ ЗАБАНЕН'}</div>` + (g.active ? ocBody(g) : '');
    } else {
      const l = (await ocReq(`/cloud/v2/universes/${uni}/user-restrictions?maxPageSize=100`)).userRestrictions || [];
      o.innerHTML = row('записей',l.length) + l.map(x => `<div style="border:1px solid var(--ln);padding:8px 12px;margin-top:8px">${row('игрок',esc(String(x.user||'').replace('users/','')))}${ocBody(x.gameJoinRestriction||{})}</div>`).join('');
    }
  }catch(e){ o.innerHTML = `<div class="msg err">${esc(e.message)}${e.status===403||e.status===401?' — ключ должен принадлежать владельцу игры':''}</div>`; }
}


const AT = {11:'Рубашка',12:'Штаны',2:'Футболка',8:'Шапка',41:'Аксессуар волос',42:'Аксессуар лица',43:'Шея',44:'Плечи',45:'Грудь',46:'Спина',47:'Пояс',19:'Gear'};
function pgMarket(){
  $('#app').innerHTML = panel('МАРКЕТПЛЕЙС','',
    `<div class="bar"><input id="mk" placeholder="Название предмета"><select id="mt" style="flex:none"><option value="">любой тип</option>${Object.entries(AT).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select>
     <select id="mr" style="flex:none"><option value="">любая редкость</option><option value="reg">обычные</option><option value="Limited">Limited</option><option value="LimitedUnique">LimitedU</option><option value="Collectible">Collectible</option></select>
     <select id="ms" style="flex:none"><option value="2">по продажам</option><option value="1">по фаворитам</option><option value="0">по релевантности</option><option value="3">по обновлению</option><option value="4">сначала дешёвые</option><option value="5">сначала дорогие</option></select></div>
     <div class="bar"><select id="mc" style="flex:none"><option value="ugc">кроме Roblox (UGC)</option><option value="all">все создатели</option><option value="roblox">только Roblox</option></select><input id="mcr" placeholder="создатель: ник или ID" style="max-width:220px"><label>цена от <input type="number" id="pmin" min="0"></label><label>до <input type="number" id="pmax" min="0"></label><label>фаворитов от <input type="number" id="fmin" min="0"></label><label>покупок от <input type="number" id="bmin" min="0"></label>
     <label>страниц <input type="number" id="mpg" value="3" min="1" max="10"></label><label><input type="checkbox" id="mn"> не в продаже</label><button onclick="runMarket()">Искать</button></div>`) + '<div id="mres"></div>';
  $('#mk').onkeydown = e => { if (e.key==='Enter') runMarket(); };
  runMarket();
}
async function runMarket(){
  const box = $('#mres'); box.innerHTML = '<div class="msg">загрузка…</div>';
  try{
    const q = $('#mk').value.trim(), pages = Math.min(10, +$('#mpg').value||1), num = i => $(i).value==='' ? null : +$(i).value;
    let items = [], cur = ''; const ug = $('#mc').value, cr = $('#mcr').value.trim(), isRb = g => g.creatorTargetId===1 || /^roblox$/i.test(g.creatorName||''); let crp = ''; if (cr){ const cu = await resolveUser(cr); crp = '&CreatorType=1&CreatorTargetId='+cu.id; }
    for (let i=0;i<(ug==='ugc'&&!cr?Math.max(pages,10):pages);i++){
      const r = await retry(() => api('catalog',`/v1/search/items/details?Keyword=${encodeURIComponent(q)}&SortType=${$('#ms').value}&SortAggregation=5&Limit=30&IncludeNotForSale=${$('#mn').checked}${crp}${cur?'&cursor='+encodeURIComponent(cur):''}`), 3);
      items.push(...(r.data||[])); cur = r.nextPageCursor; if (!cur) break; if (ug==='ugc' && !cr && items.filter(x=>!isRb(x)).length>=pages*30) break;
    }
    const pr = g => g.lowestPrice ?? g.price ?? 0, rs = $('#mr').value, ty = $('#mt').value, a = num('#pmin'), b = num('#pmax'), f = num('#fmin'), p = num('#bmin');
    items = items.filter(g => { const r = g.itemRestrictions||[];
      return (ug==='all' || cr || (ug==='ugc' ? !isRb(g) : isRb(g))) && (!rs || (rs==='reg' ? !r.length : r.includes(rs))) && (!ty || String(g.assetType)===ty) && (a==null || pr(g)>=a) && (b==null || pr(g)<=b) && (f==null || (g.favoriteCount||0)>=f) && (p==null || (g.purchaseCount||0)>=p); });
    const th = {}, ids = items.filter(g => g.itemType==='Asset').map(g=>g.id);
    for (let i=0;i<ids.length;i+=100){ try{ (await api('thumbnails',`/v1/assets?assetIds=${ids.slice(i,i+100).join()}&size=150x150&format=Png`)).data.forEach(x => th[x.targetId] = x.imageUrl); }catch{} }
    const kind = g => { const r = g.itemRestrictions||[]; return r.includes('LimitedUnique')?'LimitedU':r.includes('Limited')?'Limited':r.includes('Collectible')?'Collectible':'обычный'; };
    const price = g => g.lowestPrice!=null ? 'R$ '+fmt(g.lowestPrice) : g.price!=null ? 'R$ '+fmt(g.price) : esc(g.priceStatus||'—');
    box.innerHTML = panel('РЕЗУЛЬТАТ', `найдено: ${items.length}`, items.length ? `<div class="tw"><table><thead><tr><th></th><th>ПРЕДМЕТ</th><th>РЕДКОСТЬ</th><th>ЦЕНА</th><th>ПОКУПКИ</th><th>ФАВОРИТЫ</th><th>СОЗДАТЕЛЬ</th><th></th></tr></thead><tbody>`+
      items.map(g => `<tr class="clk" onclick="window.open('https://www.roblox.com/${g.itemType==='Bundle'?'bundles':'catalog'}/${g.id}','_blank')"><td><img class="ico" src="${esc(th[g.id]||'')}" alt=""></td><td>${esc(g.name)}</td><td>${kind(g)}</td><td>${price(g)}</td><td>${fmt(g.purchaseCount)}</td><td>${fmt(g.favoriteCount)}</td><td>${esc(g.creatorName||'—')}</td>
        <td>${kind(g)!=='обычный'?`<button class="sm" onclick="event.stopPropagation();rapOf(${g.id},this)">RAP</button>`:''}</td></tr>`).join('')+`</tbody></table></div>` : '<div class="msg">Ничего не найдено. Ослабьте фильтры или увеличьте число страниц.</div>');
  }catch(e){ errBox(box, e.message); }
}
async function rapOf(id, el){
  el.disabled = true;
  try{ const r = await api('economy',`/v1/assets/${id}/resale-data`); el.parentNode.innerHTML = `<div>RAP ${fmt(r.recentAveragePrice)}<br>${fmt(r.numberRemaining)}/${fmt(r.assetStock)}</div>`; }
  catch{ el.disabled = false; toast('Не удалось получить RAP'); }
}

(function(){
  const c = document.getElementById('bgfx'), x = c.getContext('2d'); let W, H, P = [];
  const rs = () => { W = c.width = innerWidth; H = c.height = innerHeight; P = Array.from({length:Math.min(70,Math.floor(W*H/22000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25})); };
  rs(); addEventListener('resize', rs);
  (function f(){
    x.clearRect(0,0,W,H);
    P.forEach((p,i) => { p.x=(p.x+p.vx+W)%W; p.y=(p.y+p.vy+H)%H; x.fillStyle='rgba(255,255,255,.35)'; x.fillRect(p.x,p.y,1.5,1.5);
      for (let j=i+1;j<P.length;j++){ const q=P[j], d=Math.hypot(p.x-q.x,p.y-q.y); if (d<120){ x.strokeStyle=`rgba(255,255,255,${.09*(1-d/120)})`; x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(q.x,q.y); x.stroke(); } } });
    requestAnimationFrame(f);
  })();
})();
route();
</script>
